name: mpv α - 30 przyciskow Lua (jeden APK)
'on':
  workflow_dispatch: {}
  push:
    branches:
      - feat/unified-lua-30-buttons
      - feat/hud-alpha-unified-lua-20261017
    paths:
      - .github/workflows/mpv-alpha-30-buttons.yml
      - app/src/main/kotlin/xyz/mpv/rex/**
      - app/src/main/res/**
  pull_request:
    branches:
      - master
      - feat/unified-lua-30-buttons
    paths:
      - .github/workflows/mpv-alpha-30-buttons.yml
      - app/src/main/kotlin/xyz/mpv/rex/**
      - app/src/main/res/**
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Kompiluj APK arm64
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Jeden APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            printf 'Oczekiwano 1 APK, jest %s\n' "${#apks[@]}"
            exit 1
          fi
          if [[ "${apks[0]}" != *arm64-v8a* ]]; then
            echo "Nieprawidlowy ABI: ${apks[0]}"
            exit 1
          fi
          mkdir -p dist
          cp "${apks[0]}" dist/mpv-alpha-arm64-v8a.apk
      - name: Udostepnij jeden APK
        uses: actions/upload-artifact@v4
        with:
          name: mpv-alpha-arm64
          path: dist/mpv-alpha-arm64-v8a.apk
          retention-days: 14
          compression-level: 0
