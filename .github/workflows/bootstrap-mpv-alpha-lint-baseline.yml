# Temporary bootstrap: remove this workflow after baseline is committed.
# Runs only on the dedicated PR preparation branch and never on master.
name: Bootstrap frozen MPV Alpha Lint baseline

on:
  push:
    branches:
      - chore/mpv-alpha-agent-ci-20261017
    paths:
      - .github/workflows/bootstrap-mpv-alpha-lint-baseline.yml

permissions:
  contents: write

jobs:
  snapshot:
    if: github.repository == 'laszko14/REX-Player' && github.ref == 'refs/heads/chore/mpv-alpha-agent-ci-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: chore/mpv-alpha-agent-ci-20261017
          fetch-depth: 0
          persist-credentials: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Capture current source issues once
        shell: bash
        run: |
          set -euo pipefail
          test ! -f app/lint-baseline.xml
          chmod +x gradlew
          ./gradlew :app:lintDebug -Dlint.baselines.continue=true --no-daemon --stacktrace
          test -s app/lint-baseline.xml
          echo "Frozen Lint baseline size: $(wc -c < app/lint-baseline.xml) bytes"
          grep -c '<issue' app/lint-baseline.xml || true

      - name: Commit baseline to feature branch (not master)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lint-baseline.xml
          # The bootstrap is single-use: do not ship a source-patching workflow.
          git rm .github/workflows/bootstrap-mpv-alpha-lint-baseline.yml
          git commit -m "chore(lint): commit frozen baseline and remove bootstrap"
          git fetch origin chore/mpv-alpha-agent-ci-20261017
          git rebase origin/chore/mpv-alpha-agent-ci-20261017
          git push origin HEAD:chore/mpv-alpha-agent-ci-20261017
