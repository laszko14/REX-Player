name: MPVRex - kompaktowy panel predkosci

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mpvrex-panel-predkosci-kompakt.yml'

permissions:
  contents: write

jobs:
  compact-speed-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make 3-finger speed panel compact
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/PlayerControls.kt')
          s = p.read_text(encoding='utf-8')
          original = s

          if 'PRĘDKOŚĆ • przesuń panel' not in s and 'PRĘDKOŚĆ • przesuń' not in s:
              raise SystemExit('Nie znaleziono kodu panelu prędkości 3-palce w PlayerControls.kt')

          # Make the header text shorter and smaller-looking.
          s = s.replace('PRĘDKOŚĆ • przesuń panel', 'PRĘDKOŚĆ')

          # Try to compact common size constants / dimensions that were added by the previous workflow.
          replacements = [
              ('fillMaxWidth(0.88f)', 'fillMaxWidth(0.56f)'),
              ('fillMaxWidth(0.85f)', 'fillMaxWidth(0.56f)'),
              ('fillMaxWidth(0.80f)', 'fillMaxWidth(0.56f)'),
              ('fillMaxWidth(0.75f)', 'fillMaxWidth(0.56f)'),
              ('heightIn(min = 140.dp)', 'heightIn(min = 62.dp)'),
              ('heightIn(min = 132.dp)', 'heightIn(min = 62.dp)'),
              ('heightIn(min = 128.dp)', 'heightIn(min = 62.dp)'),
              ('heightIn(min = 120.dp)', 'heightIn(min = 62.dp)'),
              ('defaultMinSize(minHeight = 132.dp)', 'defaultMinSize(minHeight = 62.dp)'),
              ('defaultMinSize(minHeight = 120.dp)', 'defaultMinSize(minHeight = 62.dp)'),
              ('RoundedCornerShape(28.dp)', 'RoundedCornerShape(18.dp)'),
              ('RoundedCornerShape(24.dp)', 'RoundedCornerShape(18.dp)'),
              ('RoundedCornerShape(22.dp)', 'RoundedCornerShape(16.dp)'),
              ('padding(horizontal = 22.dp, vertical = 18.dp)', 'padding(horizontal = 12.dp, vertical = 8.dp)'),
              ('padding(horizontal = 20.dp, vertical = 16.dp)', 'padding(horizontal = 12.dp, vertical = 8.dp)'),
              ('padding(horizontal = 18.dp, vertical = 14.dp)', 'padding(horizontal = 12.dp, vertical = 8.dp)'),
              ('padding(horizontal = 18.dp, vertical = 12.dp)', 'padding(horizontal = 12.dp, vertical = 8.dp)'),
              ('padding(horizontal = 16.dp, vertical = 12.dp)', 'padding(horizontal = 10.dp, vertical = 7.dp)'),
              ('padding(horizontal = 16.dp, vertical = 10.dp)', 'padding(horizontal = 10.dp, vertical = 7.dp)'),
              ('horizontalArrangement = Arrangement.spacedBy(18.dp)', 'horizontalArrangement = Arrangement.spacedBy(8.dp)'),
              ('horizontalArrangement = Arrangement.spacedBy(16.dp)', 'horizontalArrangement = Arrangement.spacedBy(8.dp)'),
              ('horizontalArrangement = Arrangement.spacedBy(14.dp)', 'horizontalArrangement = Arrangement.spacedBy(8.dp)'),
              ('horizontalArrangement = Arrangement.spacedBy(12.dp)', 'horizontalArrangement = Arrangement.spacedBy(8.dp)'),
              ('verticalArrangement = Arrangement.spacedBy(12.dp)', 'verticalArrangement = Arrangement.spacedBy(6.dp)'),
              ('verticalArrangement = Arrangement.spacedBy(10.dp)', 'verticalArrangement = Arrangement.spacedBy(6.dp)'),
              ('fontSize = 28.sp', 'fontSize = 16.sp'),
              ('fontSize = 26.sp', 'fontSize = 16.sp'),
              ('fontSize = 24.sp', 'fontSize = 16.sp'),
              ('fontSize = 22.sp', 'fontSize = 15.sp'),
              ('fontSize = 20.sp', 'fontSize = 15.sp'),
              ('fontSize = 18.sp', 'fontSize = 14.sp'),
              ('fontSize = 16.sp', 'fontSize = 13.sp'),
              ('modifier = Modifier.size(42.dp)', 'modifier = Modifier.size(26.dp)'),
              ('modifier = Modifier.size(40.dp)', 'modifier = Modifier.size(26.dp)'),
              ('modifier = Modifier.size(38.dp)', 'modifier = Modifier.size(24.dp)'),
              ('modifier = Modifier.size(36.dp)', 'modifier = Modifier.size(24.dp)'),
              ('modifier = Modifier.size(32.dp)', 'modifier = Modifier.size(22.dp)'),
              ('Icon(\n                  imageVector = Icons.Default.Close,', 'Icon(\n                  imageVector = Icons.Default.Close,'),
              ('modifier = Modifier.size(18.dp)', 'modifier = Modifier.size(14.dp)'),
              ('modifier = Modifier.size(16.dp)', 'modifier = Modifier.size(13.dp)'),
              ('modifier = Modifier.size(14.dp)', 'modifier = Modifier.size(12.dp)'),
          ]
          for old, new in replacements:
              s = s.replace(old, new)

          # Compact x/close and little helper texts.
          s = s.replace('text = "↶ ${rewindSeconds}s"', 'text = "↶ ${rewindSeconds}s"')
          s = s.replace('text = "↶ 10s"', 'text = "↶ 10s"')

          # Reduce panel top margin if previous workflow anchored it too low.
          s = s.replace('top.linkTo(parent.top, 86.dp)', 'top.linkTo(parent.top, 44.dp)')
          s = s.replace('top.linkTo(parent.top, 80.dp)', 'top.linkTo(parent.top, 44.dp)')
          s = s.replace('top.linkTo(parent.top, 72.dp)', 'top.linkTo(parent.top, 40.dp)')
          s = s.replace('top.linkTo(parent.top, 64.dp)', 'top.linkTo(parent.top, 36.dp)')

          # Add a final fallback: if a dedicated width constant exists, shrink it.
          s = re.sub(r'(val\s+panelWidthFraction\s*=\s*)0\.[0-9]+f', r'\g<1>0.56f', s)
          s = re.sub(r'(val\s+panelMinHeight\s*=\s*)[0-9]+\.dp', r'\g<1>62.dp', s)
          s = re.sub(r'(val\s+panelCorner\s*=\s*)[0-9]+\.dp', r'\g<1>18.dp', s)
          s = re.sub(r'(val\s+titleFontSize\s*=\s*)[0-9]+\.sp', r'\g<1>14.sp', s)
          s = re.sub(r'(val\s+speedFontSize\s*=\s*)[0-9]+\.sp', r'\g<1>15.sp', s)

          if s == original:
              raise SystemExit('Nie zastosowano żadnej zmiany — wzorce nie pasują do aktualnego kodu.')

          p.write_text(s, encoding='utf-8')
          print('Zastosowano kompaktowe zmiany panelu prędkości.')
          PY

      - name: Commit compact UI changes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/PlayerControls.kt
            git commit -m "feat(player): make 3-finger speed panel compact"
            git push
          else
            echo "No source changes to commit"
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPVRex-panel-predkosci-kompakt-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
