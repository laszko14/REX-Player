private val DEFAULT_SPEED_PANEL_PRESETS = listOf(1.25f, 1.5f, 2f, 2.5f, 3f, 3.5f, 4f, 4.5f, 5f)

private fun parseThreeFingerSpeedPresets(raw: String): List<Float> {
  val stored = raw.split(',')
  return DEFAULT_SPEED_PANEL_PRESETS.mapIndexed { index, fallback ->
    stored.getOrNull(index)?.trim()?.toFloatOrNull()?.takeIf { it in 0.25f..6f } ?: fallback
  }
}

private fun formatSpeed(value: Float): String {
  val rounded = ((value * 100).roundToInt() / 100f)
  val text = if (rounded % 1f == 0f) rounded.toInt().toString() else rounded.toString()
  return text + "x"
}

private fun formatSeek(seconds: Int): String {
  return when {
    seconds > 0 -> "+${seconds}s"
    seconds < 0 -> "${seconds}s"
    else -> "0s"
  }
}

@Composable
private fun MiniTextButton(
  text: String,
  selected: Boolean = false,
  scale: Float,
  onClick: () -> Unit,
  modifier: Modifier = Modifier,
) {
  val accent = MaterialTheme.colorScheme.primary
  Text(
    text = text,
    color = if (selected) accent else Color.White,
    fontSize = (10.5f * scale).sp,
    maxLines = 1,
    textAlign = TextAlign.Center,
    modifier = modifier
      .heightIn(min = (18 * scale).dp)
      .clip(RoundedCornerShape((7 * scale).dp))
      .clickable(onClick = onClick)
      .padding(horizontal = (2 * scale).dp, vertical = (1.5f * scale).dp),
  )
}

@Composable
fun ThreeFingerSpeedOverlay(
  preferences: PlayerPreferences,
  currentSpeed: Float,
  onClose: () -> Unit,
  onSelectSpeed: (Float) -> Unit,
  onSeekBy: (Int) -> Unit,
  modifier: Modifier = Modifier,
) {
  val rawPresets by preferences.threeFingerSpeedPresets.collectAsState()
  val seek1 by preferences.threeFingerSpeedSeekButton1.collectAsState()
  val seek2 by preferences.threeFingerSpeedSeekButton2.collectAsState()
  val seek3 by preferences.threeFingerSpeedSeekButton3.collectAsState()
  val storedX by preferences.threeFingerSpeedPositionX.collectAsState()
  val storedY by preferences.threeFingerSpeedPositionY.collectAsState()
  val panelSizePref by preferences.threeFingerSpeedPanelSize.collectAsState()
  val transparencyPref by preferences.threeFingerSpeedPanelTransparency.collectAsState()
  val panelGapPref by preferences.threeFingerSpeedPanelGap.collectAsState()

  val presets = remember(rawPresets) { parseThreeFingerSpeedPresets(rawPresets) }
  val scale = (panelSizePref.coerceIn(70, 150) / 100f)
  val gap = panelGapPref.coerceIn(0, 16)
  val backgroundAlpha = 1f - (transparencyPref.coerceIn(0, 100) / 100f)

  var localX by remember { mutableFloatStateOf(storedX.coerceIn(0f, 1f)) }
  var localY by remember { mutableFloatStateOf(storedY.coerceIn(0f, 1f)) }
  var panelSize by remember { mutableStateOf(IntSize.Zero) }

  LaunchedEffect(storedX, storedY) {
    localX = storedX.coerceIn(0f, 1f)
    localY = storedY.coerceIn(0f, 1f)
  }

  val selected = presets.indexOfFirst { kotlin.math.abs(it - currentSpeed) < 0.025f }

  BoxWithConstraints(modifier = modifier.fillMaxSize()) {
    val availableWidthPx = (constraints.maxWidth - panelSize.width).coerceAtLeast(0)
    val availableHeightPx = (constraints.maxHeight - panelSize.height).coerceAtLeast(0)
    val displayWidth = (maxWidth - 10.dp).coerceAtMost((360f * scale).dp)
    val shape = RoundedCornerShape((15 * scale).dp)

    Column(
      modifier = Modifier
        .offset {
          IntOffset(
            (localX * availableWidthPx).roundToInt(),
            (localY * availableHeightPx).roundToInt(),
          )
        }
        .width(displayWidth)
        .onSizeChanged { panelSize = it }
        .clip(shape)
        .background(Color(0xFF222228).copy(alpha = backgroundAlpha.coerceIn(0.05f, 1f)))
        .border(1.dp, Color.White.copy(alpha = 0.16f), shape)
        .pointerInput(availableWidthPx, availableHeightPx) {
          detectDragGestures(
            onDragEnd = {
              preferences.threeFingerSpeedPositionX.set(localX.coerceIn(0f, 1f))
              preferences.threeFingerSpeedPositionY.set(localY.coerceIn(0f, 1f))
            },
            onDrag = { change, dragAmount ->
              change.consume()
              if (availableWidthPx > 0) {
                localX = (localX + dragAmount.x / availableWidthPx).coerceIn(0f, 1f)
              }
              if (availableHeightPx > 0) {
                localY = (localY + dragAmount.y / availableHeightPx).coerceIn(0f, 1f)
              }
            },
          )
        }
        .padding(horizontal = (7 * scale).dp, vertical = (3 * scale).dp),
      verticalArrangement = Arrangement.spacedBy((gap * 0.35f).dp),
    ) {
      Row(
        verticalAlignment = Alignment.CenterVertically,
        horizontalArrangement = Arrangement.spacedBy((gap * 0.6f).dp),
        modifier = Modifier.heightIn(min = (20 * scale).dp),
      ) {
        Icon(
          imageVector = Icons.Default.Close,
          contentDescription = "Zamknij panel prędkości",
          tint = Color.White,
          modifier = Modifier
            .clip(RoundedCornerShape((6 * scale).dp))
            .clickable(onClick = onClose)
            .padding(1.dp)
            .width((13 * scale).dp),
        )
        presets.take(6).forEachIndexed { index, preset ->
          MiniTextButton(
            text = formatSpeed(preset),
            selected = selected == index,
            scale = scale,
            onClick = { onSelectSpeed(preset) },
            modifier = Modifier.weight(1f),
          )
        }
      }

      Row(
        verticalAlignment = Alignment.CenterVertically,
        horizontalArrangement = Arrangement.spacedBy(gap.dp),
        modifier = Modifier.heightIn(min = (19 * scale).dp),
      ) {
        presets.drop(6).take(3).forEachIndexed { index, preset ->
          MiniTextButton(
            text = formatSpeed(preset),
            selected = selected == index + 6,
            scale = scale,
            onClick = { onSelectSpeed(preset) },
            modifier = Modifier.weight(1f),
          )
        }
        MiniTextButton(text = formatSeek(seek1), scale = scale, onClick = { onSeekBy(seek1) }, modifier = Modifier.weight(1f))
        MiniTextButton(text = formatSeek(seek2), scale = scale, onClick = { onSeekBy(seek2) }, modifier = Modifier.weight(1f))
        MiniTextButton(text = formatSeek(seek3), scale = scale, onClick = { onSeekBy(seek3) }, modifier = Modifier.weight(1f))
      }
    }
  }
}
''', encoding='utf-8')
          
          # ---------- PlayerPreferencesScreen.kt patch ----------
          screen = Path('app/src/main/kotlin/xyz/mpv/rex/ui/preferences/PlayerPreferencesScreen.kt')
          s = screen.read_text(encoding='utf-8')
          # Make sure 9 speed buttons can be edited if currently hardcoded to six.
          s = re.sub(r'val presets = parseThreeFingerSpeedPresets\(rawPresets\)\.take\(6\)', 'val presets = parseThreeFingerSpeedPresets(rawPresets)', s)
          s = re.sub(r'val presets = parseThreeFingerSpeedPresets\(rawPresets\)', 'val presets = parseThreeFingerSpeedPresets(rawPresets)', s, count=1)
          # Replace 3 seek slider blocks with signed versions if present.
          replacements = [
              (
                  r'val jumpBack by preferences\.threeFingerSpeedJumpBack\.collectAsState\(\)[\s\S]*?sliderValue = jumpBack\.toFloat\(\),\n\s*\)\n\s*\}',
                  '''val seek1 by preferences.threeFingerSpeedSeekButton1.collectAsState()\n                SliderPreference(\n                  value = seek1.toFloat(),\n                  onValueChange = { preferences.threeFingerSpeedSeekButton1.set(it.roundToInt()) },\n                  title = { Text("Przycisk przewijania 1") },\n                  valueRange = -300f..300f,\n                  summary = { Text((if (seek1 > 0) "+" else "") + "${seek1} sekund") },\n                  onSliderValueChange = { preferences.threeFingerSpeedSeekButton1.set(it.roundToInt()) },\n                  sliderValue = seek1.toFloat(),\n                )\n              }'''
