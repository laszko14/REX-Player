              ),
          ]
          for pattern, replacement in replacements:
              s, n = re.subn(pattern, replacement, s, count=1)
          screen.write_text(s, encoding='utf-8')
          PY

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify single APK
        shell: bash
        run: |
          shopt -s nullglob
          files=(app/build/outputs/apk/debug/*.apk)
          echo "Znalezione APK: ${#files[@]}"
          printf '%s\n' "${files[@]}"
          if [ ${#files[@]} -ne 1 ]; then
            echo "Oczekiwano dokładnie 1 APK, a znaleziono ${#files[@]}"
            exit 1
          fi
          if [[ "${files[0]}" != *arm64-v8a* ]]; then
            echo "Wynikowy APK nie wygląda na arm64-v8a"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPV-Alpha-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit source changes after successful build
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts
            git add app/src/main/res/values/strings.xml
            git add app/src/main/kotlin/xyz/mpv/rex/preferences/PlayerPreferences.kt
            git add app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/ThreeFingerSpeedOverlay.kt
            git add app/src/main/kotlin/xyz/mpv/rex/ui/preferences/PlayerPreferencesScreen.kt
            git commit -m "feat(player): MPV Alpha single-line 2x6 speed panel and arm64-only build"
            git push
          else
            echo "Brak zmian do zapisania"
          fi
