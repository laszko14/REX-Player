name: MPV Alpha v55 debug - hold speed gestures on v54 base

on:
  push:
    branches:
      - feat/hold-speed-axes-from-v54-20261031

permissions:
  contents: read

concurrency:
  group: mpv-alpha-v55-hold-speed-axes
  cancel-in-progress: false

jobs:
  build:
    name: Verify and sign v55 hold-speed gestures (v54 baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout v54-based branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v54 baseline and isolate hold-speed changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c6107ce14a9f1768c73f975c5d60b1d8bd71aaed HEAD
          grep -q 'holdSpeedIndexDelta(verticalDrag' app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/GestureHandler.kt
          test -s app/src/test/kotlin/xyz/mpv/rex/ui/player/controls/HoldSpeedGestureMathTest.kt
          test "$(git merge-base c6107ce14a9f1768c73f975c5d60b1d8bd71aaed HEAD)" = "c6107ce14a9f1768c73f975c5d60b1d8bd71aaed"
          test -s app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/MiniProgressOverlay.kt
          test ! -f app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/components/sheets/AutoAudioDialog.kt
          : > /tmp/unexpected-files.txt
          while IFS= read -r changed; do
            case "$changed" in
              app/src/main/kotlin/xyz/mpv/rex/preferences/PlayerPreferences.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/preferences/AlphaHudPreferencesScreen.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/MiniProgressOverlay.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/PlayerControls.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/HudBarContent.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/HudLayout.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/PlaybackInfoOverlay.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/HudNetworkTraffic.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/delegates/PlayerIntentHandler.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/MPVView.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/components/sheets/MoreSheet.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/components/sheets/FullAppSettingsDialog.kt|\
              app/src/main/res/values/strings.xml|\
              app/src/main/res/values-pl/strings.xml|\
              docs/v52-normalization-full-settings.md|\
              docs/v53-speed-loudness-balance.md|\
              docs/v54-original-audio-bypass.md|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/RecentAudioBypass.kt|\
              app/src/test/kotlin/xyz/mpv/rex/ui/player/controls/RecentAudioBypassTest.kt|\
              app/src/main/kotlin/xyz/mpv/rex/preferences/AudioPreferences.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/preferences/AudioPreferencesScreen.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/SpeedLoudnessAudio.kt|\
              app/src/test/kotlin/xyz/mpv/rex/ui/player/controls/SpeedLoudnessAudioTest.kt|\
              app/src/test/kotlin/xyz/mpv/rex/ui/player/controls/HudLayoutTest.kt|\
              app/src/test/kotlin/xyz/mpv/rex/ui/player/controls/HudNetworkTrafficTest.kt|\
              app/src/test/kotlin/xyz/mpv/rex/ui/player/controls/MiniProgressTest.kt|\
              app/src/test/kotlin/xyz/mpv/rex/ui/player/delegates/NewIntentMediaMatcherTest.kt|\
              app/src/screenshotTest/kotlin/xyz/mpv/rex/ui/player/controls/MiniProgressScreenshots.kt|\
              app/src/screenshotTest/kotlin/xyz/mpv/rex/ui/player/controls/PlayerLayoutScreenshots.kt|\
              .github/workflows/mpv-alpha-v39-debug-buffer-signed.yml|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/GestureHandler.kt|\
              app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/HoldSpeedGestureMath.kt|\
              app/src/test/kotlin/xyz/mpv/rex/ui/player/controls/HoldSpeedGestureMathTest.kt|\
              app/src/main/res/values/ui_audit.xml|\
              app/src/main/res/values-pl/ui_audit.xml|\
              docs/v55-hold-speed-gesture.md)
                ;;
              *) printf '%s\n' "$changed" >> /tmp/unexpected-files.txt ;;
            esac
          done < <(git diff --name-only c6107ce14a9f1768c73f975c5d60b1d8bd71aaed HEAD)
          if [[ -s /tmp/unexpected-files.txt ]]; then
            cat /tmp/unexpected-files.txt
            echo "::error::Unexpected source modification outside approved v54-to-v55 changes."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate existing workflow syntax
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
          python3 .github/scripts/check_workflows.py

      - name: Restore existing fixed signing key
        shell: bash
        env:
          MPV_ALPHA_KEYSTORE_BASE64: ${{ secrets.MPV_ALPHA_KEYSTORE_BASE64 }}
          MPV_ALPHA_KEYSTORE_PASSWORD: ${{ secrets.MPV_ALPHA_KEYSTORE_PASSWORD }}
          MPV_ALPHA_KEY_ALIAS: ${{ secrets.MPV_ALPHA_KEY_ALIAS }}
          MPV_ALPHA_KEY_PASSWORD: ${{ secrets.MPV_ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MPV_ALPHA_KEYSTORE_BASE64 MPV_ALPHA_KEYSTORE_PASSWORD MPV_ALPHA_KEY_ALIAS MPV_ALPHA_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing configured signing key component: $name"
              exit 1
            fi
          done
          install -d -m 700 "$RUNNER_TEMP/mpv-alpha-signing"
          keystore="$RUNNER_TEMP/mpv-alpha-signing/release.jks"
          printf '%s' "$MPV_ALPHA_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "MPV_ALPHA_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Assemble signed debug, tests and lint
        shell: bash
        env:
          MPV_ALPHA_KEYSTORE_PASSWORD: ${{ secrets.MPV_ALPHA_KEYSTORE_PASSWORD }}
          MPV_ALPHA_KEY_ALIAS: ${{ secrets.MPV_ALPHA_KEY_ALIAS }}
          MPV_ALPHA_KEY_PASSWORD: ${{ secrets.MPV_ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon \
            -PmpvAlphaVersionCode=100055 -PmpvAlphaVersionName=v55

      - name: Validate signer, package, version and unique ARM64 artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one ARM64 APK, got ${#apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          [[ "$apk" == *arm64-v8a*.apk ]] || { echo "::error::Not ARM64"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          actual_cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected_cert=$(tr -d '[:space:]' < .github/mpv-alpha-signing-certificate.sha256)
          [[ "$actual_cert" == "$expected_cert" ]] || { echo "::error::Signing certificate mismatch"; exit 1; }
          package=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep '^package:')
          [[ "$package" == *"name='xyz.mpv.rex.debug'"* ]] || { echo "::error::Package mismatch"; exit 1; }
          [[ "$package" == *"versionCode='1000552'"* ]] || { echo "::error::Version must exceed v54"; exit 1; }
          [[ "$package" == *"versionName='v55'"* ]] || { echo "::error::Version name mismatch"; exit 1; }
          mkdir -p dist
          cp "$apk" dist/MPV-Alpha-v55-debug-hold-speed-gestures-arm64-v8a.apk

      - name: Upload signed debug update
        uses: actions/upload-artifact@v4
        with:
          name: MPV-Alpha-v55-DEBUG-hold-speed-gestures-update
          path: dist/MPV-Alpha-v55-debug-hold-speed-gestures-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
