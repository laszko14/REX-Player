name: MPV Alpha v56 - signed transparency update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpv-alpha-v56-transparency-update
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/build/player-transparency-v56'
    name: Build signed ARM64 update from vv55
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify reviewed player source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 73645268bd7f582db50a1bac91b87fabbd0496f7 HEAD
          changed=$(git diff --name-only 73645268bd7f582db50a1bac91b87fabbd0496f7 HEAD)
          [[ "$changed" == '.github/workflows/mpv-alpha-v39-debug-buffer-signed.yml' ]] || {
            echo '::error::Build branch must only change this workflow from PR #64'
            exit 1
          }
          test -s app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/LuaButtonGrid.kt
          test -s app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/PlaybackInfoOverlay.kt
          grep -q 'mpvControlsTransparencyPercent' app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/PlayerControls.kt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore existing fixed signing key
        shell: bash
        env:
          MPV_ALPHA_KEYSTORE_BASE64: ${{ secrets.MPV_ALPHA_KEYSTORE_BASE64 }}
          MPV_ALPHA_KEYSTORE_PASSWORD: ${{ secrets.MPV_ALPHA_KEYSTORE_PASSWORD }}
          MPV_ALPHA_KEY_ALIAS: ${{ secrets.MPV_ALPHA_KEY_ALIAS }}
          MPV_ALPHA_KEY_PASSWORD: ${{ secrets.MPV_ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MPV_ALPHA_KEYSTORE_BASE64 MPV_ALPHA_KEYSTORE_PASSWORD MPV_ALPHA_KEY_ALIAS MPV_ALPHA_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing configured signing key component: $name"
              exit 1
            fi
          done
          install -d -m 700 "$RUNNER_TEMP/mpv-alpha-signing"
          keystore="$RUNNER_TEMP/mpv-alpha-signing/release.jks"
          printf '%s' "$MPV_ALPHA_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "MPV_ALPHA_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Assemble signed v56 debug APK
        shell: bash
        env:
          MPV_ALPHA_KEYSTORE_PASSWORD: ${{ secrets.MPV_ALPHA_KEYSTORE_PASSWORD }}
          MPV_ALPHA_KEY_ALIAS: ${{ secrets.MPV_ALPHA_KEY_ALIAS }}
          MPV_ALPHA_KEY_PASSWORD: ${{ secrets.MPV_ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon \
            -PmpvAlphaVersionCode=100056 -PmpvAlphaVersionName=v56

      - name: Verify signer package version and ABI
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          (( ${#apks[@]} == 1 )) || { echo '::error::Expected one APK'; exit 1; }
          apk="${apks[0]}"
          [[ "$apk" == *arm64-v8a*.apk ]] || { echo '::error::Expected ARM64 APK'; exit 1; }
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify "$apk"
          actual_cert=$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected_cert=$(tr -d '[:space:]' < .github/mpv-alpha-signing-certificate.sha256)
          [[ "$actual_cert" == "$expected_cert" ]] || { echo '::error::Signing certificate mismatch'; exit 1; }
          package=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep '^package:')
          [[ "$package" == *"name='xyz.mpv.rex.debug'"* ]] || { echo '::error::Package mismatch'; exit 1; }
          [[ "$package" == *"versionCode='1000562'"* ]] || { echo '::error::Version code mismatch'; exit 1; }
          [[ "$package" == *"versionName='v56'"* ]] || { echo '::error::Version name mismatch'; exit 1; }
          mkdir -p dist
          cp "$apk" dist/MPV-Alpha-v56-transparency-arm64-v8a.apk

      - name: Upload compatible update APK
        uses: actions/upload-artifact@v4
        with:
          name: MPV-Alpha-v56-ARM64-transparency-update
          path: dist/MPV-Alpha-v56-transparency-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
