name: MPV Alpha — testy i jeden APK ARM64

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Testy jednostkowe i kompilacja
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Jeden APK ARM64
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [[ "${apks[0]}" != *arm64-v8a* ]]; then
            printf 'Nieprawidłowy zestaw APK: %s\n' "${apks[*]}"
            exit 1
          fi
          mkdir -p dist
          cp "${apks[0]}" dist/MPV-Alpha-Lua-Fix-arm64-v8a.apk
      - name: Udostępnij tylko pojedynczą aplikację
        uses: actions/upload-artifact@v4
        with:
          name: MPV-Alpha-Lua-Fix-arm64
          path: dist/MPV-Alpha-Lua-Fix-arm64-v8a.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
