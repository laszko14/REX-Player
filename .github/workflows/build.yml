name: MPV Alpha - kontrola i podpisany APK na zadanie

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "AGENTS.md"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpv-alpha-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  sources:
    name: YAML, Python i Lua
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj parser YAML
        run: python3 -m pip install --disable-pip-version-check "PyYAML>=6,<7"

      - name: Sprawdz skladnie workflow i osadzonego Pythona
        run: python3 .github/scripts/check_workflows.py

      - name: Testy walidatora workflow
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Sprawdz kompletne polskie zasoby, formaty i terminologie
        run: python3 .github/scripts/check_polish.py

      - name: Sprawdz samodzielne pliki Lua (jezeli sa)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t lua_files < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
          if (( ${#lua_files[@]} == 0 )); then
            echo "Brak samodzielnych plikow .lua w repozytorium - pomijam."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.2
          for file in "${lua_files[@]}"; do
            echo "Sprawdzam Lua: $file"
            luac5.2 -p "$file"
          done

  android:
    name: Android - build, testy, lint
    needs: sources
    # Full compile, unit tests and Lint only on PRs. Signed master builds run once,
    # without a simultaneous redundant unsigned Android build.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches the Gradle user home, dependency transforms and reusable task outputs.
      # The setup-java Gradle cache is intentionally disabled to avoid competing caches.
      - name: Cache Gradle - dependencies and build outputs
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sprawdz, czy zatwierdzono baze dotychczasowych problemow
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch app/lint-baseline.xml
          test -s app/lint-baseline.xml
          echo "Lint baseline jest zapisany w repozytorium. Nowe problemy beda wykrywane."

      - name: Build, testy jednostkowe i Android Lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon

      # The v47 Auto Audio PR needs an installable diagnostic build for
      # real HTTP/HLS/DASH speech detection on ARM64, without replacing
      # the user's signed production APK or changing its version number.
      - name: Testowy APK ARM64 Auto Audio v47 (oddzielny pakiet .debug)
        if: ${{ github.head_ref == 'feature/v47-arm64-native-vad-integration' }}
        uses: actions/upload-artifact@v4
        with:
          name: mpv-alpha-auto-audio-v47-arm64-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Zapisz raport Lint przy bledzie
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpv-alpha-lint-raport
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7

  signed_apk:
    name: MPV Alpha - podpisany APK do aktualizacji
    # Signing secrets and a write-capable GitHub token are NEVER exposed to PRs.
    # A specifically marked push to master can build a signed APK without browser login.
    # All ordinary pushes and pull requests continue to run unsigned CI only.
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[mpv-alpha-apk]'))) }}
    # Manual releases only need fast source validation, not a second unsigned Android build.
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    concurrency:
      group: mpv-alpha-signed-apk
      cancel-in-progress: false
    steps:
      - name: Pobierz kod i dotychczasowe znaczniki wersji
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upewnij sie, ze to aktualny MPV Alpha (HUD + Lua + ikona)
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/mpv_alpha_icon.webp
          test -s app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/LuaButtonGrid.kt
          test -s app/src/main/kotlin/xyz/mpv/rex/ui/preferences/AlphaHudPreferencesScreen.kt
          grep -q '@drawable/mpv_alpha_icon' app/src/main/AndroidManifest.xml
          grep -q 'LuaButtonGrid(' app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/PlayerControls.kt
          grep -q 'PlaybackInfoOverlay(' app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/PlayerControls.kt
          grep -q 'hudScalePercent' app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/PlaybackInfoOverlay.kt
          echo "OK: nowy HUD Alpha, 30 guzikow Lua i wlasna ikona sa w kodzie."

      - name: Przygotuj kolejny nieuzywany numer od v15
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest=14
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^mpv-alpha-v([0-9]+)$ ]]; then
              number=$((10#${BASH_REMATCH[1]}))
              if (( number > latest )); then latest="$number"; fi
            fi
          done < <(git tag -l 'mpv-alpha-v*')
          next=$((latest + 1))
          # ABI-specific version codes are calculated as base * 10 + 2 (ARM64).
          # Choose a value larger than existing REX debug builds (214 * 10 + 2).
          base_code=$((100000 + next))
          if (( base_code > 214748364 )); then
            echo "::error::versionCode poza dopuszczalnym zakresem"
            exit 1
          fi
          echo "number=$next" >> "$GITHUB_OUTPUT"
          echo "tag=mpv-alpha-v$next" >> "$GITHUB_OUTPUT"
          echo "MPV_ALPHA_VERSION_NAME=v$next" >> "$GITHUB_ENV"
          echo "MPV_ALPHA_VERSION_CODE=$base_code" >> "$GITHUB_ENV"

      - name: Sprawdz sekrety i odtworz staly klucz podpisu
        shell: bash
        env:
          MPV_ALPHA_KEYSTORE_BASE64: ${{ secrets.MPV_ALPHA_KEYSTORE_BASE64 }}
          MPV_ALPHA_KEYSTORE_PASSWORD: ${{ secrets.MPV_ALPHA_KEYSTORE_PASSWORD }}
          MPV_ALPHA_KEY_ALIAS: ${{ secrets.MPV_ALPHA_KEY_ALIAS }}
          MPV_ALPHA_KEY_PASSWORD: ${{ secrets.MPV_ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MPV_ALPHA_KEYSTORE_BASE64 MPV_ALPHA_KEYSTORE_PASSWORD MPV_ALPHA_KEY_ALIAS MPV_ALPHA_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Brak sekretu GitHub Actions: $name"
              exit 1
            fi
          done
          install -d -m 700 "$RUNNER_TEMP/mpv-alpha-signing"
          keystore="$RUNNER_TEMP/mpv-alpha-signing/release.jks"
          printf '%s' "$MPV_ALPHA_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "MPV_ALPHA_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches the Gradle user home, dependency transforms and reusable task outputs.
      # The setup-java Gradle cache is intentionally disabled to avoid competing caches.
      - name: Cache Gradle - dependencies and build outputs
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Zbuduj podpisany APK ARM64
        env:
          MPV_ALPHA_KEYSTORE_PASSWORD: ${{ secrets.MPV_ALPHA_KEYSTORE_PASSWORD }}
          MPV_ALPHA_KEY_ALIAS: ${{ secrets.MPV_ALPHA_KEY_ALIAS }}
          MPV_ALPHA_KEY_PASSWORD: ${{ secrets.MPV_ALPHA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon \
            -PmpvAlphaVersionCode="$MPV_ALPHA_VERSION_CODE" \
            -PmpvAlphaVersionName="$MPV_ALPHA_VERSION_NAME"

      - name: Zweryfikuj podpis, pakiet, wersje i jeden APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Oczekiwano dokladnie jednego APK ARM64, znaleziono ${#apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          [[ "$apk" == *arm64-v8a*.apk ]] || { echo "::error::To nie APK ARM64"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          # Public certificate fingerprint from the successfully signed v24 APK.
          # This verifies update compatibility without exposing the private key.
          certificate=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected_certificate=$(tr -d '[:space:]' < .github/mpv-alpha-signing-certificate.sha256)
          [[ "$certificate" == "$expected_certificate" ]] || { echo "::error::Podpis rozni sie od aktualizacji v24"; exit 1; }
          package=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep '^package:')
          expected_code=$((MPV_ALPHA_VERSION_CODE * 10 + 2))
          [[ "$package" == *"name='xyz.mpv.rex.debug'"* ]] || { echo "::error::Zmiana ID pakietu"; exit 1; }
          [[ "$package" == *"versionCode='$expected_code'"* ]] || { echo "::error::Niepoprawny versionCode"; exit 1; }
          [[ "$package" == *"versionName='$MPV_ALPHA_VERSION_NAME'"* ]] || { echo "::error::Niepoprawny versionName"; exit 1; }
          mkdir -p dist
          filename="MPV-Alpha-${MPV_ALPHA_VERSION_NAME}-arm64-v8a.apk"
          cp "$apk" "dist/$filename"
          echo "path=dist/$filename" >> "$GITHUB_OUTPUT"
          echo "Podpisana wersja: $filename"

      - name: Zarezerwuj numer wersji w Git (nie uzywaj ponownie)
        shell: bash
        env:
          ALPHA_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$ALPHA_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$ALPHA_TAG"

      - name: Udostepnij jeden podpisany APK
        uses: actions/upload-artifact@v4
        with:
          name: MPV-Alpha-v${{ steps.version.outputs.number }}-ARM64-AKTUALIZACJA
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
