name: MPV Alpha - podglady interfejsu (PNG)

on:
  workflow_dispatch:
  # PNG previews are intentionally opt-in; no automatic runs on PR or APK builds.

permissions:
  contents: read

concurrency:
  group: alpha-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-png:
    name: Wygeneruj podglady PNG bez APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Wygeneruj podglady Android Compose
        run: |
          chmod +x gradlew
          ./gradlew :app:updateDebugScreenshotTest --stacktrace --no-daemon --no-configuration-cache
      - name: Zweryfikuj polskie ekrany ustawien
        run: python3 .github/scripts/check_polish_previews.py
      - name: Sprawdz obecnosc trzynastu zrzutow
        shell: bash
        run: |
          set -euo pipefail
          root="app/src/screenshotTestDebug/reference"
          test -d "$root"
          count=$(find "$root" -type f -name '*.png' | wc -l)
          if (( count < 13 )); then
            echo "::error::Oczekiwano co najmniej 13 podgladow, znaleziono $count"
            exit 1
          fi
          find "$root" -type f -name '*.png' -printf '%P\n' | sort
      - name: Pobierz PNG - HUD i Lua (bez APK)
        uses: actions/upload-artifact@v4
        with:
          name: MPV-Alpha-interfejs-podglady-PNG
          path: app/src/screenshotTestDebug/reference/**/*.png
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
