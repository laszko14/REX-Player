name: MPVRex - korektor dzwieku 5 pasm

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/mpvrex-korektor-infinity.yml'

permissions:
  contents: write

jobs:
  eq:
    name: Dodaj EQ i zbuduj debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Przygotuj Android SDK
        uses: android-actions/setup-android@v4

      - name: Zainstaluj SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Dodaj korektor i jego ustawienia
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          
          root = Path('app/src/main/kotlin/xyz/mpv/rex')
          
          def edit(relative, transforms):
              p = root / relative
              src = p.read_text(encoding='utf-8')
              for old, new in transforms:
                  if old not in src:
                      raise RuntimeError(f'Patch incompatible with {p}: {old[:110]!r}')
                  if src.count(old) != 1:
                      raise RuntimeError(f'Expected one anchor in {p}, found {src.count(old)}: {old[:110]!r}')
                  src = src.replace(old, new, 1)
              p.write_text(src, encoding='utf-8')
          
          base64_files = {
            'app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/components/sheets/RexEqualizerSheet.kt': '',
            'app/src/main/kotlin/xyz/mpv/rex/ui/player/controls/RexEqualizerAudio.kt': '',
          }
          
          if (root / 'ui/player/controls/RexEqualizerAudio.kt').exists():
              print('Korektor juz dodany. Pomijam ponowne nakladanie patcha.')
          else:
              edit('preferences/AudioPreferences.kt', [
                ('  val volumeBoostCap = preferenceStore.getInt("audio_volume_boost_cap", 30)\n',
                 '  val volumeBoostCap = preferenceStore.getInt("audio_volume_boost_cap", 30)\n'
                 '  val rexEqEnabled = preferenceStore.getBoolean("rex_equalizer_enabled", false)\n'
                 '  val rexEqPreset = preferenceStore.getString("rex_equalizer_preset", "Flat")\n'
                 '  val rexEqBands = preferenceStore.getString("rex_equalizer_bands", "0,0,0,0,0")\n'
                 '  val rexEqBoost = preferenceStore.getInt("rex_equalizer_boost", 0)\n')
              ])
              edit('ui/player/PlayerEnums.kt', [
                ('  AudioTracks,\n', '  AudioTracks,\n  Equalizer,\n')
              ])
              edit('ui/player/controls/PlayerSheets.kt', [
                ('import xyz.mpv.rex.ui.player.controls.components.sheets.AudioTracksSheet\n',
                 'import xyz.mpv.rex.ui.player.controls.components.sheets.AudioTracksSheet\n'
                 'import xyz.mpv.rex.ui.player.controls.components.sheets.RexEqualizerSheet\n'),
                ('    Sheets.AudioTracks -> {\n',
                 '    Sheets.Equalizer -> {\n'
                 '      RexEqualizerSheet(onDismissRequest = onDismissRequest)\n'
                 '    }\n\n'
                 '    Sheets.AudioTracks -> {\n'),
                ('        onOpenDelayPanel = { onOpenPanel(Panels.AudioDelay) },\n',
                 '        onOpenDelayPanel = { onOpenPanel(Panels.AudioDelay) },\n'
                 '        onOpenEqualizer = { onShowSheet(Sheets.Equalizer) },\n'),
              ])
              edit('ui/player/controls/components/sheets/AudioTracksSheet.kt', [
                ('import androidx.compose.material.icons.filled.MoreTime\n',
                 'import androidx.compose.material.icons.filled.MoreTime\n'
                 'import androidx.compose.material.icons.filled.Equalizer\n'),
                ('  onOpenDelayPanel: () -> Unit,\n',
                 '  onOpenDelayPanel: () -> Unit,\n'
                 '  onOpenEqualizer: () -> Unit,\n'),
                ('          IconButton(onClick = onOpenDelayPanel) {\n'
                 '            Icon(Icons.Default.MoreTime, null)\n'
                 '          }',
                 '          IconButton(onClick = onOpenDelayPanel) {\n'
                 '            Icon(Icons.Default.MoreTime, null)\n'
                 '          }\n'
                 '          IconButton(onClick = onOpenEqualizer) {\n'
                 '            Icon(Icons.Default.Equalizer, contentDescription = "Korektor dzwieku")\n'
                 '          }')
              ])
              edit('ui/player/controls/PlayerControls.kt', [
                ('  val audioPreferences = koinInject<AudioPreferences>()\n',
                 '  val audioPreferences = koinInject<AudioPreferences>()\n'
                 '  val rexEqEnabled by audioPreferences.rexEqEnabled.collectAsState()\n'
                 '  val rexEqBands by audioPreferences.rexEqBands.collectAsState()\n'
                 '  val rexEqBoost by audioPreferences.rexEqBoost.collectAsState()\n'
                 '  val rexEqMediaPath by MPVLib.propString["path"].collectAsState()\n'
                 '  LaunchedEffect(rexEqEnabled, rexEqBands, rexEqBoost, rexEqMediaPath) {\n'
                 '    delay(130L)\n'
                 '    RexEqualizerAudio.apply(rexEqEnabled, RexEqualizerAudio.parseBands(rexEqBands), rexEqBoost)\n'
                 '  }\n')
              ])
          
              for relative, encoded in base64_files.items():
                  p = Path(relative)
                  if p.exists():
                      raise RuntimeError(f'Refusing to overwrite existing EQ file: {p}')
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(base64.b64decode(encoded))
          
              print('Dodano korektor 5 pasm, 10 profili, Custom, Volume Boost 0..10dB.')
              print('Korektor dostepny przez Player -> sciezki audio -> ikona korektora.')
          
          PY

      - name: Zbuduj APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: MPVRex-EQ-5-pasm-arm64
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Zapisz zmiany po udanej kompilacji
        if: github.ref == 'refs/heads/master'
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard app/src/main/kotlin)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/kotlin/xyz/mpv/rex
            git commit -m 'feat(audio): add native five-band MPV equalizer with presets and boost'
            git push origin HEAD:master
          else
            echo 'Korektor juz jest obecny.'
          fi
